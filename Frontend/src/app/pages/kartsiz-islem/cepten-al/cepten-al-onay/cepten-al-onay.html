<div class="atm-screen">
  <svg class="wave-decoration" viewBox="0 0 300 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M300 260 L0 260 Q60 200 140 180 Q200 165 240 120 Q270 85 300 60 Z" fill="#f5c842" opacity="0.55"/>
    <path d="M300 260 L60 260 Q130 210 200 190 Q250 175 275 140 Q292 115 300 90 Z" fill="#e8a800" opacity="0.45"/>
    <path d="M300 260 L140 260 Q200 235 250 210 Q278 195 295 170 L300 145 Z" fill="#d49200" opacity="0.35"/>
  </svg>

  <p class="header-text">Cepten Para Al</p>

  <div class="icerik">
    <div class="onay-kutu">

      <div class="bilgi-satir-wrapper">
        <div class="bilgi-satir">
          <span class="bilgi-etiket">Alıcı T.C. No</span>
          <span class="bilgi-deger">{{ tcNo }}</span>
        </div>
        <div class="bilgi-satir">
          <span class="bilgi-etiket">Alıcı Telefon</span>
          <span class="bilgi-deger">{{ kendiTelNo }}</span>
        </div>
        <div class="bilgi-satir">
          <span class="bilgi-etiket">Gönderen Telefon</span>
          <span class="bilgi-deger">{{ gonderenTelNo }}</span>
        </div>
        <div class="bilgi-satir">
          <span class="bilgi-etiket">Tutar</span>
          <span class="bilgi-deger maksimum">{{ tutar }} ₺</span>
        </div>
      </div>

      <p class="onay-aciklama" *ngIf="!hataMesaji">
        Lütfen işleminizi onaylıyorsanız ONAY butonuna tıklayın.
      </p>

      <p class="hata-mesaji" *ngIf="hataMesaji">
        {{ hataMesaji }}
      </p>

    </div>
  </div>

  <div class="bottom-bar">
    <button class="atm-btn" (click)="geriDon()" [disabled]="yukleniyor">
      <span class="icon-left">
        <svg viewBox="0 0 13 13" fill="none"><path d="M9 6.5H4M4 6.5L6.5 4M4 6.5L6.5 9" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="btn-label">Geri</span>
    </button>
    <button class="atm-btn" (click)="onayla()" [disabled]="yukleniyor">
      <span class="btn-label">{{ yukleniyor ? 'İşleniyor...' : 'Onay' }}</span>
      <span class="icon-right" *ngIf="!yukleniyor">
        <svg viewBox="0 0 13 13" fill="none"><path d="M4 6.5h5M9 6.5L6.5 4M9 6.5L6.5 9" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
    </button>
  </div>
</div>
