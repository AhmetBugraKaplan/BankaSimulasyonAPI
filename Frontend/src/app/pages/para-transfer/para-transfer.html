<div class="atm-screen">

    <!-- Sağ alt köşe sarı dalga -->
    <svg class="wave-decoration" viewBox="0 0 300 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M300 260 L0 260 Q60 200 140 180 Q200 165 240 120 Q270 85 300 60 Z" fill="#f5c842" opacity="0.55" />
        <path d="M300 260 L60 260 Q130 210 200 190 Q250 175 275 140 Q292 115 300 90 Z" fill="#e8a800" opacity="0.45" />
        <path d="M300 260 L140 260 Q200 235 250 210 Q278 195 295 170 L300 145 Z" fill="#d49200" opacity="0.35" />
    </svg>

    <!-- Adım 1: İşlem Tipi Seçimi -->
    <ng-container *ngIf="adim === 1">

        <p class="header-text">Lütfen yapmak istediğiniz işlem tipini seçiniz.</p>

        <div class="btn-grid">

            <div class="btn-row">
                <button class="atm-btn" (click)="islemSecimi('Havale')">
                     <span class="icon-left">
                        <svg viewBox="0 0 10 10" fill="none">
                            <path d="M7 5H3M3 5L5 3M3 5L5 7" stroke="#1a1a1a" stroke-width="1.4"
                                stroke-linecap="round" />
                        </svg>
                    </span>
                    <span class="btn-label">Havale</span>
                </button>

                <button class="atm-btn" (click)="islemSecimi('EFT')">
                    <span class="btn-label">EFT</span>
                    <span class="icon-right">
                        <svg viewBox="0 0 10 10" fill="none">
                            <path d="M3 5h4M7 5L5 3M7 5L5 7" stroke="#1a1a1a" stroke-width="1.4"
                                stroke-linecap="round" />
                        </svg>
                    </span>
                </button>
            </div>

            <div class="btn-row">
                <button class="atm-btn" (click)="islemSecimi('YatirimHesabimdan')">
                    <span class="icon-left">
                        <svg viewBox="0 0 10 10" fill="none">
                            <path d="M7 5H3M3 5L5 3M3 5L5 7" stroke="#1a1a1a" stroke-width="1.4"
                                stroke-linecap="round" />
                        </svg>
                    </span>
                    <span class="btn-label">Yatırım Hesabımdan</span>
                </button>
                <div class="btn-placeholder"></div>
            </div>

        </div>

        <div class="spacer"></div>

        <div class="bottom-bar">
            <button class="atm-btn" (click)="geriDon()">
                <span class="icon-left">
                    <svg viewBox="0 0 10 10" fill="none">
                        <path d="M7 5H3M3 5L5 3M3 5L5 7" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" />
                    </svg>
                </span>
                <span class="btn-label">Geri</span>
            </button>

            <button class="atm-btn" (click)="anaMenuye()">
                <span class="btn-label">Ana Menü</span>
                <span class="icon-right">
                    <svg viewBox="0 0 10 10" fill="none">
                        <path d="M3 5h4M7 5L5 3M7 5L5 7" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round" />
                    </svg>
                </span>
            </button>
        </div>

    </ng-container>

    <!-- Adım 2: Hesap Seçimi -->
    <ng-container *ngIf="adim === 2">
        <!-- Sonraki görseller gelince burası doldurulacak -->
    </ng-container>

    <!-- Adım 3: Tutar Girişi -->
    <ng-container *ngIf="adim === 3">
        <!-- Sonraki görseller gelince burası doldurulacak -->
    </ng-container>

</div>
